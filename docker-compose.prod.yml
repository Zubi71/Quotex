version: "3.9"

# ──────────────────────────────────────────────────────────────────────────────
# OTC Signal Intelligence — Production Docker Compose
#
# Key differences from development:
#   - No volume mounts (code is COPYed into images at build time)
#   - restart: always on all services
#   - Resource limits enforced
#   - Production environment variables required
#   - Nginx with SSL (certificate paths must be mounted from host)
# ──────────────────────────────────────────────────────────────────────────────

networks:
  otc_prod_net:
    driver: bridge

volumes:
  mysql_prod_data:
    driver: local
  redis_prod_data:
    driver: local

services:

  # ────────────────────────────────────────────────────────
  # MySQL 8.0 — Production
  # ────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: otc_mysql_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - mysql_prod_data:/var/lib/mysql
    expose:
      - "3306"
    networks:
      - otc_prod_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=${DB_ROOT_PASSWORD}"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  # ────────────────────────────────────────────────────────
  # Redis 7 — Production (with password)
  # ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: otc_redis_prod
    restart: always
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD}"
      --save 60 1
      --save 300 10
      --loglevel warning
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data
    expose:
      - "6379"
    networks:
      - otc_prod_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
        reservations:
          cpus: "0.1"
          memory: 128M

  # ────────────────────────────────────────────────────────
  # API — PHP-FPM 8.3 (Production Build)
  # Code is baked into the image; no volume mounts.
  # ────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
      target: production
    image: otc-signal-api:${IMAGE_TAG:-latest}
    container_name: otc_api_prod
    restart: always
    working_dir: /var/www/api
    environment:
      APP_NAME: "${APP_NAME}"
      APP_ENV: production
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "false"
      APP_URL: "${APP_URL}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      REDIS_HOST: redis
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_PORT: "6379"
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      BROADCAST_DRIVER: reverb
      REVERB_APP_ID: "${REVERB_APP_ID}"
      REVERB_APP_KEY: "${REVERB_APP_KEY}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET}"
      REVERB_HOST: "${REVERB_HOST}"
      REVERB_PORT: "${REVERB_PORT:-8080}"
      REVERB_SCHEME: "${REVERB_SCHEME:-https}"
      DEFAULT_BROKER: "${DEFAULT_BROKER:-mock}"
      MOCK_BROKER_SEED: "${MOCK_BROKER_SEED:-42}"
      USE_MOCK_DATA: "${USE_MOCK_DATA:-false}"
      ENABLE_QUOTEX_ADAPTER: "${ENABLE_QUOTEX_ADAPTER:-false}"
      QUOTEX_ADAPTER_ENABLED: "${QUOTEX_ADAPTER_ENABLED:-false}"
      QUOTEX_WS_URL: "${QUOTEX_WS_URL:-}"
      QUOTEX_SESSION_TOKEN: "${QUOTEX_SESSION_TOKEN:-}"
      QUOTEX_ACCOUNT_TYPE: "${QUOTEX_ACCOUNT_TYPE:-demo}"
      ENABLE_AUTO_SCAN: "${ENABLE_AUTO_SCAN:-false}"
      ENABLE_REAL_ACCOUNT_ACTIONS: "${ENABLE_REAL_ACCOUNT_ACTIONS:-false}"
      DEFAULT_CONFIDENCE_THRESHOLD: "${DEFAULT_CONFIDENCE_THRESHOLD:-70}"
      DEFAULT_MIN_DATA_QUALITY: "${DEFAULT_MIN_DATA_QUALITY:-80}"
      DEFAULT_MIN_CANDLE_HISTORY: "${DEFAULT_MIN_CANDLE_HISTORY:-200}"
      MAX_SIGNALS_PER_HOUR: "${MAX_SIGNALS_PER_HOUR:-10}"
      SIGNAL_COOLDOWN_SECONDS: "${SIGNAL_COOLDOWN_SECONDS:-60}"
      LOG_CHANNEL: stack
      LOG_LEVEL: warning
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "9000"
    networks:
      - otc_prod_net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  # ────────────────────────────────────────────────────────
  # Frontend — Next.js 14 (Production Build)
  # ────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.prod
    image: otc-signal-web:${IMAGE_TAG:-latest}
    container_name: otc_web_prod
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL}"
      NEXT_PUBLIC_WS_URL: "${NEXT_PUBLIC_WS_URL}"
      NEXT_PUBLIC_APP_NAME: "${NEXT_PUBLIC_APP_NAME}"
      NEXT_PUBLIC_DEMO_MODE: "${NEXT_PUBLIC_DEMO_MODE:-false}"
    expose:
      - "3000"
    networks:
      - otc_prod_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  # ────────────────────────────────────────────────────────
  # Nginx — Production with SSL
  # Mount your SSL certificates at runtime.
  # Replace /etc/ssl/otc/ paths with actual certificate paths.
  # ────────────────────────────────────────────────────────
  nginx:
    build:
      context: .
      dockerfile: infrastructure/docker/nginx/Dockerfile
    image: otc-signal-nginx:${IMAGE_TAG:-latest}
    container_name: otc_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "8000:8000"
      - "8080:8080"
    volumes:
      - /etc/ssl/otc/fullchain.pem:/etc/ssl/certs/otc.crt:ro
      - /etc/ssl/otc/privkey.pem:/etc/ssl/private/otc.key:ro
      - /etc/ssl/dhparam.pem:/etc/ssl/dhparam.pem:ro
    depends_on:
      - api
      - web
      - reverb
    networks:
      - otc_prod_net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 32M

  # ────────────────────────────────────────────────────────
  # Reverb — WebSocket Server (Production)
  # ────────────────────────────────────────────────────────
  reverb:
    image: otc-signal-api:${IMAGE_TAG:-latest}
    container_name: otc_reverb_prod
    restart: always
    working_dir: /var/www/api
    command: php artisan reverb:start --host=0.0.0.0 --port=8080 --no-interaction
    environment:
      APP_ENV: production
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "false"
      BROADCAST_DRIVER: reverb
      REVERB_APP_ID: "${REVERB_APP_ID}"
      REVERB_APP_KEY: "${REVERB_APP_KEY}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET}"
      REVERB_HOST: "0.0.0.0"
      REVERB_PORT: "8080"
      REVERB_SCHEME: "${REVERB_SCHEME:-https}"
      REDIS_HOST: redis
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_PORT: "6379"
      LOG_CHANNEL: stack
      LOG_LEVEL: warning
    expose:
      - "8080"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - otc_prod_net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ────────────────────────────────────────────────────────
  # Queue Worker (Production)
  # ────────────────────────────────────────────────────────
  worker:
    image: otc-signal-api:${IMAGE_TAG:-latest}
    container_name: otc_worker_prod
    restart: always
    working_dir: /var/www/api
    command: php artisan queue:work redis --sleep=1 --tries=3 --max-time=3600 --queue=default,signals,backtests
    environment:
      APP_ENV: production
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      REDIS_HOST: redis
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_PORT: "6379"
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      BROADCAST_DRIVER: reverb
      REVERB_APP_ID: "${REVERB_APP_ID}"
      REVERB_APP_KEY: "${REVERB_APP_KEY}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET}"
      LOG_CHANNEL: stack
      LOG_LEVEL: warning
      DEFAULT_BROKER: "${DEFAULT_BROKER}"
      MOCK_BROKER_SEED: "${MOCK_BROKER_SEED:-42}"
      USE_MOCK_DATA: "${USE_MOCK_DATA:-false}"
      DEFAULT_CONFIDENCE_THRESHOLD: "${DEFAULT_CONFIDENCE_THRESHOLD:-70}"
      DEFAULT_MIN_DATA_QUALITY: "${DEFAULT_MIN_DATA_QUALITY:-80}"
      DEFAULT_MIN_CANDLE_HISTORY: "${DEFAULT_MIN_CANDLE_HISTORY:-200}"
      ENABLE_REAL_ACCOUNT_ACTIONS: "${ENABLE_REAL_ACCOUNT_ACTIONS:-false}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - otc_prod_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  # ────────────────────────────────────────────────────────
  # Scheduler (Production)
  # Runs php artisan schedule:run every 60 seconds.
  # Alternative: add a host cron job: * * * * * docker exec otc_api_prod php artisan schedule:run
  # ────────────────────────────────────────────────────────
  scheduler:
    image: otc-signal-api:${IMAGE_TAG:-latest}
    container_name: otc_scheduler_prod
    restart: always
    working_dir: /var/www/api
    command: >
      sh -c "while true; do
        php artisan schedule:run --no-interaction 2>&1;
        sleep 60;
      done"
    environment:
      APP_ENV: production
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      REDIS_HOST: redis
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_PORT: "6379"
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      LOG_CHANNEL: stack
      LOG_LEVEL: warning
      DEFAULT_BROKER: "${DEFAULT_BROKER}"
      USE_MOCK_DATA: "${USE_MOCK_DATA:-false}"
      ENABLE_AUTO_SCAN: "${ENABLE_AUTO_SCAN:-false}"
      ENABLE_REAL_ACCOUNT_ACTIONS: "false"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - otc_prod_net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
