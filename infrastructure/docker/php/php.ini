; ──────────────────────────────────────────────────────────────────────────────
; OTC Signal Intelligence — PHP Production Configuration (php.ini)
; Mounted at: /usr/local/etc/php/conf.d/99-custom.ini
; ──────────────────────────────────────────────────────────────────────────────

[PHP]
; ── Memory ────────────────────────────────────────────────────────────────────
memory_limit = 256M

; ── Execution limits ───────────────────────────────────────────────────────────
; Increase for long-running CLI commands (queue workers, backtests).
; The CLI ini overrides this for artisan commands.
max_execution_time = 60
max_input_time = 60

; ── File uploads ───────────────────────────────────────────────────────────────
upload_max_filesize = 10M
post_max_size = 10M
max_file_uploads = 10

; ── Error reporting (production: suppress display, log everything) ─────────────
; E_ALL & ~E_DEPRECATED & ~E_STRICT
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php/php_errors.log
log_errors_max_len = 4096
ignore_repeated_errors = Off
ignore_repeated_source = Off
report_memleaks = On

; ── Output buffering ───────────────────────────────────────────────────────────
output_buffering = 4096

; ── Data handling ─────────────────────────────────────────────────────────────
default_charset = "UTF-8"
internal_encoding = UTF-8
serialize_precision = -1

; ── String handling ───────────────────────────────────────────────────────────
mbstring.internal_encoding = UTF-8
mbstring.http_output = UTF-8
mbstring.language = neutral
mbstring.encoding_translation = Off
mbstring.detect_order = auto
mbstring.substitute_character = none

; ── Session ───────────────────────────────────────────────────────────────────
session.gc_maxlifetime = 7200
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_secure = 0
session.cookie_samesite = Lax
session.use_cookies = 1
session.use_only_cookies = 1

; ── Date ──────────────────────────────────────────────────────────────────────
date.timezone = UTC

; ── Request limits ────────────────────────────────────────────────────────────
max_input_vars = 5000
max_input_nesting_level = 64

; ── Misc ──────────────────────────────────────────────────────────────────────
short_open_tag = Off
allow_url_fopen = On
allow_url_include = Off
expose_php = Off
realpath_cache_size = 4096k
realpath_cache_ttl = 120

; ── CLI specific overrides ─────────────────────────────────────────────────────
; Queue workers and artisan commands benefit from unlimited execution time.
; These settings take effect when PHP is run from CLI.
[CLI]
; memory_limit and max_execution_time are set via cli-specific ini or env
; For queue workers, set --max-time flag on queue:work instead.

; ── OPcache ───────────────────────────────────────────────────────────────────
[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.max_wasted_percentage = 5
opcache.revalidate_freq = 0
; In production, disable file timestamp checking for maximum performance.
; Set to 1 during development.
opcache.validate_timestamps = 0
opcache.fast_shutdown = 1
opcache.huge_code_pages = 1
opcache.preload_user = www-data
; opcache.preload = /var/www/api/bootstrap/cache/opcache.php
opcache.save_comments = 1
opcache.jit = tracing
opcache.jit_buffer_size = 64M

; ── Redis extension ────────────────────────────────────────────────────────────
[redis]
redis.session.locking_enabled = 1
redis.session.lock_expire = 60
redis.session.lock_wait_time = 10000
redis.session.lock_retries = 100

; ── PDO ────────────────────────────────────────────────────────────────────────
[pdo]
pdo.dsn.mysql = "mysql:host=mysql;dbname=otc_signal_intelligence"

; ── Timezone (enforce UTC at extension level) ──────────────────────────────────
[date]
date.timezone = "UTC"
