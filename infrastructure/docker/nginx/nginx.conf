# ──────────────────────────────────────────────────────────────────────────────
# OTC Signal Intelligence — Main nginx.conf
# ──────────────────────────────────────────────────────────────────────────────

user  nginx;

# Automatically set to the number of available CPU cores.
worker_processes auto;

# Maximum number of open files per worker. Should be >= worker_connections.
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    # Maximum connections per worker process.
    worker_connections 4096;

    # Accept as many connections as possible after nginx gets notification
    # about a new connection. May work better in high load environments.
    multi_accept on;

    # Use epoll on Linux for best performance.
    use epoll;
}

http {
    # ── MIME types ─────────────────────────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging format ─────────────────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    # ── Performance ────────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 100;

    # ── Buffer sizes ───────────────────────────────────────────────────────────
    client_body_buffer_size    128k;
    client_max_body_size       10m;
    client_header_buffer_size  1k;
    large_client_header_buffers 4 8k;
    output_buffers             1 32k;
    postpone_output            1460;

    # ── Timeouts ───────────────────────────────────────────────────────────────
    client_body_timeout    12s;
    client_header_timeout  12s;
    send_timeout           10s;

    # ── Proxy settings (for upstreams) ─────────────────────────────────────────
    proxy_http_version         1.1;
    proxy_connect_timeout      10s;
    proxy_send_timeout         60s;
    proxy_read_timeout         60s;
    proxy_buffer_size          4k;
    proxy_buffers              8 16k;
    proxy_busy_buffers_size    32k;
    proxy_temp_file_write_size 64k;

    # ── Security hardening ─────────────────────────────────────────────────────
    server_tokens off;
    # Prevent clickjacking — enforced per-server-block also
    more_clear_headers Server;

    # ── Open file cache ────────────────────────────────────────────────────────
    open_file_cache          max=1000 inactive=20s;
    open_file_cache_valid    30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    # ── Gzip (global defaults — per-server blocks can override) ────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_min_length   256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # ── Real IP from reverse proxies (e.g., Cloudflare, load balancer) ─────────
    # Add your trusted proxy/CDN CIDR ranges here.
    # real_ip_header     X-Forwarded-For;
    # set_real_ip_from   10.0.0.0/8;
    # set_real_ip_from   172.16.0.0/12;
    # set_real_ip_from   192.168.0.0/16;

    # ── Include server block configurations ────────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}
