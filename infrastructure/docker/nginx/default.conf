# ──────────────────────────────────────────────────────────────────────────────
# OTC Signal Intelligence — Nginx default.conf
# Server blocks:
#   port 8000  → Laravel API (PHP-FPM at api:9000)
#   port 80    → Next.js frontend (web:3000)
# ──────────────────────────────────────────────────────────────────────────────

# ── Rate limiting zones ───────────────────────────────────────────────────────
# General API zone: 60 requests/minute per IP
limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;

# Signal generation zone: 20 requests/minute per IP (heavier computation)
limit_req_zone $binary_remote_addr zone=api_signals:10m rate=20r/m;

# Auth endpoints: 10 requests/minute per IP (brute-force mitigation)
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/m;

# Frontend zone: 120 requests/minute per IP
limit_req_zone $binary_remote_addr zone=frontend:10m rate=120r/m;

# ── Upstream definitions ──────────────────────────────────────────────────────
upstream php_fpm {
    server api:9000;
    keepalive 16;
}

upstream nextjs {
    server web:3000;
    keepalive 8;
}

# ── Security header map ───────────────────────────────────────────────────────
map $sent_http_content_type $csp_policy {
    default "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' ws://localhost:8080 wss://localhost:8080; frame-ancestors 'none'";
}

# ══════════════════════════════════════════════════════════════════════════════
# SERVER BLOCK: Laravel API — port 8000
# ══════════════════════════════════════════════════════════════════════════════
server {
    listen 8000;
    server_name _;

    root /var/www/api/public;
    index index.php;

    charset utf-8;
    client_max_body_size 10M;

    # ── Access & Error logs ───────────────────────────────────────────────────
    access_log /var/log/nginx/api_access.log combined;
    error_log  /var/log/nginx/api_error.log warn;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options            "SAMEORIGIN"                always;
    add_header X-Content-Type-Options     "nosniff"                   always;
    add_header X-XSS-Protection           "1; mode=block"             always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy    $csp_policy                 always;
    # Uncomment HSTS for HTTPS deployments:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ── Hide Nginx version ────────────────────────────────────────────────────
    server_tokens off;

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        application/xml
        application/xml+rss
        text/css
        text/javascript
        text/plain
        text/xml;

    # ── Static asset caching ──────────────────────────────────────────────────
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|eot|otf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Deny hidden files ─────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Deny sensitive Laravel files ──────────────────────────────────────────
    location ~ ^/(\.env|\.git|storage|bootstrap/cache) {
        deny all;
        return 404;
    }

    # ── Rate limiting on auth endpoints ──────────────────────────────────────
    location ~ ^/api/(login|register|forgot-password|reset-password) {
        limit_req zone=api_auth burst=5 nodelay;
        limit_req_status 429;

        try_files $uri $uri/ /index.php?$query_string;

        fastcgi_pass php_fpm;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 60;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # ── Rate limiting on signal generation ───────────────────────────────────
    location ~ ^/api/signals/generate {
        limit_req zone=api_signals burst=5 nodelay;
        limit_req_status 429;

        try_files $uri $uri/ /index.php?$query_string;

        fastcgi_pass php_fpm;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 120;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # ── General API routing ───────────────────────────────────────────────────
    location / {
        limit_req zone=api_general burst=20 nodelay;
        limit_req_status 429;

        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM FastCGI handler ───────────────────────────────────────────────
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php_fpm;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_read_timeout 120;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_intercept_errors on;
    }

    # ── 429 Too Many Requests error page ─────────────────────────────────────
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"error":"Too many requests. Please slow down.","retry_after":60}';
    }
}

# ══════════════════════════════════════════════════════════════════════════════
# SERVER BLOCK: Next.js Frontend — port 80
# ══════════════════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name _;

    charset utf-8;
    client_max_body_size 10M;

    # ── Access & Error logs ───────────────────────────────────────────────────
    access_log /var/log/nginx/web_access.log combined;
    error_log  /var/log/nginx/web_error.log warn;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options            "SAMEORIGIN"                always;
    add_header X-Content-Type-Options     "nosniff"                   always;
    add_header X-XSS-Protection           "1; mode=block"             always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy    $csp_policy                 always;

    server_tokens off;

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        application/xml
        text/css
        text/javascript
        text/plain;

    # ── Deny hidden files ─────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Next.js static assets (_next/static) — long-lived cache ──────────────
    location /_next/static/ {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Next.js image optimisation endpoint ──────────────────────────────────
    location /_next/image {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30;
    }

    # ── Public static files ───────────────────────────────────────────────────
    location /static/ {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Rate limiting on frontend ─────────────────────────────────────────────
    location / {
        limit_req zone=frontend burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60;
        proxy_connect_timeout 10;
    }

    # ── 429 Too Many Requests ─────────────────────────────────────────────────
    error_page 429 = @web_rate_limited;
    location @web_rate_limited {
        return 429 "Rate limit exceeded. Please try again shortly.";
    }
}
