version: "3.9"

# ──────────────────────────────────────────────────────────────────────────────
# OTC Signal Intelligence — Development Docker Compose
# All services share a common network. Volume mounts enable hot-reload.
# ──────────────────────────────────────────────────────────────────────────────

networks:
  otc_net:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

services:

  # ────────────────────────────────────────────────────────
  # MySQL 8.0
  # ────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: otc_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_DATABASE:-otc_signal_intelligence}
      MYSQL_USER: ${DB_USERNAME:-otc_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - otc_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ────────────────────────────────────────────────────────
  # Redis 7
  # ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: otc_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - otc_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ────────────────────────────────────────────────────────
  # API — PHP-FPM 8.3 (Laravel 11)
  # ────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
    container_name: otc_api
    restart: unless-stopped
    working_dir: /var/www/api
    volumes:
      - ./apps/api:/var/www/api
      - ./infrastructure/docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      APP_NAME: "${APP_NAME:-OTC Signal Intelligence}"
      APP_ENV: "${APP_ENV:-local}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: "${APP_URL:-http://localhost}"
      DB_CONNECTION: "${DB_CONNECTION:-mysql}"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-otc_signal_intelligence}"
      DB_USERNAME: "${DB_USERNAME:-otc_user}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      REDIS_HOST: redis
      REDIS_PASSWORD: "${REDIS_PASSWORD:-null}"
      REDIS_PORT: "6379"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-redis}"
      CACHE_DRIVER: "${CACHE_DRIVER:-redis}"
      SESSION_DRIVER: "${SESSION_DRIVER:-redis}"
      BROADCAST_DRIVER: "${BROADCAST_DRIVER:-reverb}"
      REVERB_APP_ID: "${REVERB_APP_ID:-otc-signal-app}"
      REVERB_APP_KEY: "${REVERB_APP_KEY:-otc-signal-key}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET:-otc-signal-secret}"
      REVERB_HOST: "${REVERB_HOST:-localhost}"
      REVERB_PORT: "${REVERB_PORT:-8080}"
      REVERB_SCHEME: "${REVERB_SCHEME:-http}"
      DEFAULT_BROKER: "${DEFAULT_BROKER:-mock}"
      MOCK_BROKER_SEED: "${MOCK_BROKER_SEED:-42}"
      USE_MOCK_DATA: "${USE_MOCK_DATA:-true}"
      ENABLE_QUOTEX_ADAPTER: "${ENABLE_QUOTEX_ADAPTER:-false}"
      QUOTEX_ADAPTER_ENABLED: "${QUOTEX_ADAPTER_ENABLED:-false}"
      QUOTEX_WS_URL: "${QUOTEX_WS_URL:-}"
      QUOTEX_SESSION_TOKEN: "${QUOTEX_SESSION_TOKEN:-}"
      QUOTEX_ACCOUNT_TYPE: "${QUOTEX_ACCOUNT_TYPE:-demo}"
      ENABLE_AUTO_SCAN: "${ENABLE_AUTO_SCAN:-false}"
      ENABLE_REAL_ACCOUNT_ACTIONS: "${ENABLE_REAL_ACCOUNT_ACTIONS:-false}"
      DEFAULT_CONFIDENCE_THRESHOLD: "${DEFAULT_CONFIDENCE_THRESHOLD:-70}"
      DEFAULT_MIN_DATA_QUALITY: "${DEFAULT_MIN_DATA_QUALITY:-80}"
      DEFAULT_MIN_CANDLE_HISTORY: "${DEFAULT_MIN_CANDLE_HISTORY:-200}"
      MAX_SIGNALS_PER_HOUR: "${MAX_SIGNALS_PER_HOUR:-10}"
      SIGNAL_COOLDOWN_SECONDS: "${SIGNAL_COOLDOWN_SECONDS:-60}"
      LOG_CHANNEL: "${LOG_CHANNEL:-stack}"
      LOG_LEVEL: "${LOG_LEVEL:-debug}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - otc_net
    expose:
      - "9000"

  # ────────────────────────────────────────────────────────
  # Frontend — Next.js 14 (Development)
  # ────────────────────────────────────────────────────────
  web:
    image: node:20-alpine
    container_name: otc_web
    restart: unless-stopped
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm dev"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}"
      NEXT_PUBLIC_WS_URL: "${NEXT_PUBLIC_WS_URL:-ws://localhost:8080}"
      NEXT_PUBLIC_APP_NAME: "${NEXT_PUBLIC_APP_NAME:-OTC Signal Intelligence}"
      NEXT_PUBLIC_DEMO_MODE: "${NEXT_PUBLIC_DEMO_MODE:-true}"
      WATCHPACK_POLLING: "true"
    expose:
      - "3000"
    networks:
      - otc_net

  # ────────────────────────────────────────────────────────
  # Nginx — Reverse Proxy
  # port 80  -> Next.js frontend
  # port 8000 -> Laravel API (via php-fpm)
  # ────────────────────────────────────────────────────────
  nginx:
    build:
      context: .
      dockerfile: infrastructure/docker/nginx/Dockerfile
    container_name: otc_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "8000:8000"
    volumes:
      - ./apps/api/public:/var/www/api/public:ro
      - ./infrastructure/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    networks:
      - otc_net

  # ────────────────────────────────────────────────────────
  # Laravel Reverb — WebSocket Server
  # ────────────────────────────────────────────────────────
  reverb:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
    container_name: otc_reverb
    restart: unless-stopped
    working_dir: /var/www/api
    command: php artisan reverb:start --host=0.0.0.0 --port=8080 --no-interaction
    volumes:
      - ./apps/api:/var/www/api
      - ./infrastructure/docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      APP_ENV: "${APP_ENV:-local}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      BROADCAST_DRIVER: reverb
      REVERB_APP_ID: "${REVERB_APP_ID:-otc-signal-app}"
      REVERB_APP_KEY: "${REVERB_APP_KEY:-otc-signal-key}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET:-otc-signal-secret}"
      REVERB_HOST: "0.0.0.0"
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - otc_net

  # ────────────────────────────────────────────────────────
  # Queue Worker — processes signals, backtests, and default jobs
  # ────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
    container_name: otc_worker
    restart: unless-stopped
    working_dir: /var/www/api
    command: php artisan queue:work redis --sleep=1 --tries=3 --max-time=3600 --queue=default,signals,backtests
    volumes:
      - ./apps/api:/var/www/api
      - ./infrastructure/docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      APP_ENV: "${APP_ENV:-local}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      DB_CONNECTION: "${DB_CONNECTION:-mysql}"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-otc_signal_intelligence}"
      DB_USERNAME: "${DB_USERNAME:-otc_user}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      BROADCAST_DRIVER: reverb
      REVERB_APP_ID: "${REVERB_APP_ID:-otc-signal-app}"
      REVERB_APP_KEY: "${REVERB_APP_KEY:-otc-signal-key}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET:-otc-signal-secret}"
      LOG_CHANNEL: "${LOG_CHANNEL:-stack}"
      LOG_LEVEL: "${LOG_LEVEL:-debug}"
      DEFAULT_BROKER: "${DEFAULT_BROKER:-mock}"
      MOCK_BROKER_SEED: "${MOCK_BROKER_SEED:-42}"
      USE_MOCK_DATA: "${USE_MOCK_DATA:-true}"
      DEFAULT_CONFIDENCE_THRESHOLD: "${DEFAULT_CONFIDENCE_THRESHOLD:-70}"
      DEFAULT_MIN_DATA_QUALITY: "${DEFAULT_MIN_DATA_QUALITY:-80}"
      DEFAULT_MIN_CANDLE_HISTORY: "${DEFAULT_MIN_CANDLE_HISTORY:-200}"
      ENABLE_REAL_ACCOUNT_ACTIONS: "${ENABLE_REAL_ACCOUNT_ACTIONS:-false}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - otc_net

  # ────────────────────────────────────────────────────────
  # Scheduler — runs php artisan schedule:run every 60 seconds
  # In production, replace this with a host-level cron entry.
  # ────────────────────────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
    container_name: otc_scheduler
    restart: unless-stopped
    working_dir: /var/www/api
    command: >
      sh -c "while true; do
        php artisan schedule:run --no-interaction 2>&1;
        sleep 60;
      done"
    volumes:
      - ./apps/api:/var/www/api
      - ./infrastructure/docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      APP_ENV: "${APP_ENV:-local}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      DB_CONNECTION: "${DB_CONNECTION:-mysql}"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-otc_signal_intelligence}"
      DB_USERNAME: "${DB_USERNAME:-otc_user}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      LOG_CHANNEL: "${LOG_CHANNEL:-stack}"
      LOG_LEVEL: "${LOG_LEVEL:-debug}"
      DEFAULT_BROKER: "${DEFAULT_BROKER:-mock}"
      MOCK_BROKER_SEED: "${MOCK_BROKER_SEED:-42}"
      USE_MOCK_DATA: "${USE_MOCK_DATA:-true}"
      ENABLE_AUTO_SCAN: "${ENABLE_AUTO_SCAN:-false}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - otc_net
